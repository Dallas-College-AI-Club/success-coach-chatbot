<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
<title>A sunny meadow and lake</title>
<desc>Responsive grassy terrain, lake, trees and flowers. Buildings are layered separately so the chat can keep its position.</desc>
<defs>
  <linearGradient id="lawn" x2="0" y2="1"><stop stop-color="#d1f2ac"/><stop offset=".5" stop-color="#b5e78f"/><stop offset="1" stop-color="#8dd172"/></linearGradient>
  <linearGradient id="water" x2="0" y2="1"><stop stop-color="#a2e8ee"/><stop offset="1" stop-color="#58c9e2"/></linearGradient>
  <g id="flower"><path d="M0 0q-3-12 0-25m-1 17q-8 0-8-6 7 0 8 6" stroke="#68a65b" stroke-width="2" fill="#80ba66"/><g fill="currentColor"><ellipse cy="-29" rx="4" ry="7"/><ellipse cx="6" cy="-24" rx="7" ry="4" transform="rotate(-25 6 -24)"/><ellipse cx="4" cy="-17" rx="4" ry="7" transform="rotate(-30 4 -17)"/><ellipse cx="-4" cy="-17" rx="4" ry="7" transform="rotate(30 -4 -17)"/><ellipse cx="-6" cy="-24" rx="7" ry="4" transform="rotate(25 -6 -24)"/></g><circle cy="-23" r="4" fill="#ffce4b"/></g>
  <g id="grass" stroke="#75b46a" stroke-width="2" stroke-linecap="round" fill="none"><path d="M0 0q-1-11-6-16M0 0q2-14 8-20M0 0q7-7 11-7"/></g>
  <g id="tree"><path d="M0 0v-79m0 22-18-19m18 7 19-23" fill="none" stroke="#baa077" stroke-width="7" stroke-linecap="round"/><path d="M-33-57c-24-12-18-37 1-42-6-25 21-44 40-32 19-9 41 9 37 26 28 7 24 41 3 47-16 13-27 5-37 8-18 9-31 6-44-7Z" fill="#9bd286"/><path d="M-35-98c-5 22 9 35 30 36 9 14 29 14 46 6-14 18-33 13-41 7-17 9-37 3-44-10-15-8-12-30 9-39Z" fill="#7fc174" opacity=".6"/></g>
</defs>
<rect width="100%" height="100%" fill="#d8f3b9"/>
<!-- Flexible terrain fills the viewport; buildings, trees and flowers retain their proportions. -->
<svg width="100%" height="100%" viewBox="0 0 1440 1000" preserveAspectRatio="none">
 <rect width="1440" height="1000" fill="url(#lawn)"/>
 <path d="M0 0h1440v192q-285-40-552 0T0 159Z" fill="#d8f3b9"/>
 <path d="M0 312q234-55 480 6t463-5 497 17v268H0Z" fill="#c7eca2"/>
 <path d="M-20 406c230-105 392-56 598-17s425-18 570 18 244 99 312 110v101c-176-17-274-87-433-45s-314 40-470-14S169 571-20 647Z" fill="#a7dc8d"/>
 <path d="M-20 429c230-106 389-57 591-18s430-18 577 17 244 99 312 110v57c-176-17-275-87-433-45s-314 40-470-14S169 548-20 624Z" fill="url(#water)"/>
 <path d="M149 468h64m40 22h31m192-43h48m61 37h76m310-14h45m165 40h57m-20 32h76" stroke="#defbfb" stroke-width="3" stroke-linecap="round" opacity=".85"/>
 <path d="M0 694q307-84 586-3t495-9 359 13v305H0Z" fill="#b6e98f"/>
 <path d="M0 869q271-62 535 15t531-5 374-10v131H0Z" fill="#97da79" opacity=".6"/>
</svg>
<!-- Root coordinates are viewport pixels: decorations never inherit terrain stretching. -->
<defs>
 <g id="small-tree"><use href="#tree" transform="scale(.36)"/></g>
 <g id="near-tree"><use href="#tree" transform="scale(.65)"/></g>
 <g id="flowers"><use href="#flower" transform="translate(0 0) scale(.7)" color="#fc88b8"/><use href="#flower" transform="translate(21 10) scale(.54)" color="#b798f4"/><use href="#flower" transform="translate(39 8) scale(.5)" color="#fff8e1"/></g>
 <g id="small-flowers"><use href="#flowers" transform="scale(.68)"/></g>
 <g id="yellow-flower"><use href="#flower" transform="scale(.65)" color="#ffe477"/></g>
</defs>
<use href="#small-tree" x="9%" y="36%"/><use href="#small-tree" x="93%" y="35%"/>
<use href="#near-tree" x="0%" y="64%"/><use href="#near-tree" x="99%" y="70%"/>
<use href="#flowers" x="3%" y="78%"/><use href="#small-flowers" x="13%" y="64%"/>
<use href="#flowers" x="86%" y="89%"/><use href="#small-flowers" x="85%" y="66%"/>
<use href="#flowers" x="18%" y="96%"/><use href="#small-flowers" x="63%" y="81%"/>
<use href="#yellow-flower" x="9%" y="89%"/><use href="#yellow-flower" x="96%" y="96%"/>
<g opacity=".6"><use href="#grass" x="7%" y="82%"/><use href="#grass" x="29%" y="94%"/><use href="#grass" x="78%" y="80%"/><use href="#grass" x="92%" y="93%"/></g>
</svg>
