[project]
name = "dallasai-club-success-coach-chatbot-data"
version = "0.1.0"
description = "Data scraping module for the Dallas College Success Coach Chatbot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pgvector>=0.5.0",
  "psycopg[binary]>=3.3.4",
  "python-dotenv>=1.2.2",
  "sqlalchemy>=2.0.51",
  "requests>=2.31",       # scrapers (pipeline/archive_syllabi_cv.py)
  "beautifulsoup4>=4.12", # HTML parsing (facts extraction stage)
  "lxml>=5.0",            # fast parser backend for bs4
  "playwright>=1.44",     # headless-browser catalog fetcher (pipeline/catalog_fetch.py);
  # after install run:  playwright install chromium
  "pypdf>=6.14.2",
  "anthropic>=0.40",      # extraction engine (dallasai/pipeline/extract.py)
  "jsonschema>=4.21",     # facts-schema validation (extract + verifiers)
  "html-to-markdown>=3.10.6",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # archive/tests/ is frozen with its modules; never collected

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dallasai"]


[tool.ruff]
target-version = "py313"
src = ["dallasai"]

[tool.ruff.lint]
select = ["E", "F", "I"]
fixable = ["ALL"]

[tool.pyright]
reportPrivateImportUsage = "none"
enableTypeIgnoreComments = true
include = ["dallasai"]
#typeCheckingMode = "basic"

reportReturnType = "warning"
reportArgumentType = "warning"
reportOperatorIssue = "warning"
reportImportCycles = "warning"
reportDuplicateImport = "warning"
reportUnusedCallResult = "none"
