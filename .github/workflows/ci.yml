name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: pytest (apps/data)
    runs-on: ubuntu-latest
    env:
      # Fail if uv.lock is stale instead of silently re-resolving in CI.
      UV_LOCKED: "1"
    defaults:
      run:
        working-directory: apps/data
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/ -q

  frontend:
    name: frontend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run verify
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/never-connected
